# ============================================
# Frappe CRM  →  通过 IP 直接访问
# 站点名：40.160.55.204
# ============================================

server {
    listen 80;
    server_name 40.160.55.204;

    # CRM 附件上传可能很大（CSV 导入、图片等）
    client_max_body_size 100M;

    # 访问日志（方便排查，生产可选）
    access_log /var/log/nginx/crm-access.log;
    error_log /var/log/nginx/crm-error.log;

    # socket.io 单独转到 realtime worker (9000)
    # ⚠️ 必须放在 location / 之前，否则会被 / 抢先匹配
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 其余全部请求转到 Frappe web (8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Frappe-Site-Name $host;

        # 长连接超时（Frappe 有 long-polling）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 禁用缓存（Frappe 自己控制缓存策略）
        proxy_buffering off;
    }
}

# ==========================================================================
# Frappe CRM — 同一台服务器上两套独立环境，通过公网 IP + 端口访问
#
#   http://<公网IP>:8081/crm   → 团队 A   (compose 项目 crm-a)
#   http://<公网IP>:8082/crm   → 团队 B   (compose 项目 crm-b)
#
# 两套栈各自有独立的 MariaDB / Redis / 站点数据，互不影响。容器端口只绑在
# 127.0.0.1 上，公网流量一律先过这里的 nginx。
#
# 安装：
#   sudo cp nginx-crm-multi.conf /etc/nginx/sites-available/crm-multi
#   sudo ln -sf /etc/nginx/sites-available/crm-multi /etc/nginx/sites-enabled/crm-multi
#   sudo rm -f /etc/nginx/sites-enabled/crm        # 旧的单站点域名配置
#   sudo nginx -t && sudo systemctl reload nginx
#
# 改站点名时，记得同步改下面两处 X-Frappe-Site-Name，以及各自 .env 里的
# SITE_NAME —— 两边必须一致。
# ==========================================================================

# ---------- 团队 A ----------
server {
    listen 8081;
    server_name _;

    client_max_body_size 100M;

    access_log /var/log/nginx/crm-a-access.log;
    error_log  /var/log/nginx/crm-a-error.log;

    # socket.io 走 realtime worker。必须放在 location / 之前，否则会被抢先匹配。
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # $http_host 带端口，Frappe 生成绝对 URL 时才不会丢掉 :8081
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 显式指定站点，不依赖 Host 解析（用 IP 访问时 Host 里没有站点信息，
        # 否则只能靠 common_site_config 的 default_site 兜底）。
        proxy_set_header X-Frappe-Site-Name crm-a.youruicheng.cn;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

# ---------- 团队 B ----------
server {
    listen 8082;
    server_name _;

    client_max_body_size 100M;

    access_log /var/log/nginx/crm-b-access.log;
    error_log  /var/log/nginx/crm-b-error.log;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Frappe-Site-Name crm-b.youruicheng.cn;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

# ---------- 80 端口上的便捷入口 ----------
# 让用户记 http://<IP>/a 就行，不用记端口。
# 注意：这个 server 块接管 80 端口的默认站点，安装后要把 /etc/nginx/
# sites-enabled/default 删掉，否则两个 default_server 冲突，nginx -t 会报错。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # $host 不含端口，正好用来拼目标地址
    location = /a  { return 302 http://$host:8081/crm; }
    location = /a/ { return 302 http://$host:8081/crm; }
    location = /b  { return 302 http://$host:8082/crm; }
    location = /b/ { return 302 http://$host:8082/crm; }

    location / { return 404; }
}

# ---------- 旧域名兜底 ----------
# crm.youruicheng.cn 的 DNS 还指着这台机器，老书签直接打过来会撞上上面那个
# 404。给它一个跳转，指到团队 A。等确认没人再用这个域名了，整段可以删掉。
server {
    listen 80;
    server_name crm.youruicheng.cn;
    return 302 http://117.50.226.162:8081/crm;
}
